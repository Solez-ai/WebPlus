<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web+ High Performance Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --accent: #22d3ee;
            --danger: #ef4444;
            --glass: rgba(15, 23, 42, 0.7);
        }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        #gameCanvas {
            width: 1000px;
            height: 700px;
            display: block;
        }
        .ui-layer {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        #score {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 0 10px var(--accent);
            letter-spacing: 2px;
        }
        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--glass);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
        }
        #gameOver h1 {
            font-size: 72px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        #gameOverScore {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 40px;
            font-weight: 500;
        }
        .btn {
            background: var(--accent);
            color: #020617;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
            pointer-events: auto;
        }
        .btn:hover {
            transform: scale(1.05);
            background: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 5;
        }
        .logo-text {
            position: absolute;
            top: 50px;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="logo-text">WEB+ HIGH PERFORMANCE ENGINE</div>
    
    <div id="game-container">
        <div id="gameCanvas"></div>
        
        <div class="ui-layer">
            <div id="score">SCORE: 00</div>
            <div id="instructions">LOADING ASSETS...</div>
        </div>

        <div id="start-screen">
            <button id="startButton" class="btn">Initialize Core</button>
        </div>

        <div id="gameOver">
            <h1>CRITICAL FAILURE</h1>
            <div id="gameOverScore">SCORE: 0</div>
            <button id="restartButton" class="btn">Reboot System</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
