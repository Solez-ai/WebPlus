<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web+ Simple Demo</title>
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }
        #app {
            text-align: center;
            max-width: 600px;
        }
        h1 { color: #22d3ee; }
        p { color: #94a3b8; }
        #modal {
            display: none;
            background: #1e293b;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div id="app">Loading Web+...</div>
    <div id="modal">Modal Content</div>
    <script src="app.js"></script>
</body>
</html>
