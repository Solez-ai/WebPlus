<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web+ Chat App</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #22d3ee;
            text-align: center;
            margin: 0 0 1rem 0;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .login-section {
            background: #1e293b;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .login-section input {
            background: #334155;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 0.75rem;
            border-radius: 6px;
            margin-right: 0.5rem;
            width: 200px;
        }
        #chatMessages {
            flex: 1;
            background: #1e293b;
            border-radius: 8px;
            padding: 1rem;
            overflow-y: auto;
            min-height: 300px;
            margin-bottom: 1rem;
        }
        .message {
            background: #334155;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }
        .message .username {
            color: #22d3ee;
            font-weight: bold;
            font-size: 0.875rem;
        }
        .message .text {
            margin-top: 0.25rem;
        }
        .input-section {
            display: flex;
            gap: 0.5rem;
        }
        #messageInput {
            flex: 1;
            background: #334155;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 0.75rem;
            border-radius: 6px;
        }
        #sendButton {
            background: #22d3ee;
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #sendButton:hover {
            background: #06b6d4;
        }
        #error {
            color: #ef4444;
            margin-top: 0.5rem;
        }
        #status {
            color: #22d3ee;
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <h1>Web+ Real-time Chat</h1>
    <div class="chat-container">
        <div class="login-section">
            <input type="text" id="usernameInput" placeholder="Enter username">
        </div>
        <div id="chatMessages"></div>
        <div class="input-section">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button id="sendButton">Send</button>
        </div>
        <div id="error"></div>
        <div id="status"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
